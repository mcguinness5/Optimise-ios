<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e1013">
<meta name="apple-mobile-web-app-title" content="Optimise">
<title>Daily Optimisation</title>
<style>
:root{--bg:#0e1013;--card:#1a1d23;--text:#eef0f3;--muted:#9aa3af;--accent:#22c55e;--line:#2a2e36;--p:#3b82f6;--c:#f59e0b;--f:#ec4899;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding-bottom:190px}
main{max-width:560px;margin:0 auto;padding:12px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;border:1px solid var(--line)}
h2{font-size:15px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.muted{color:var(--muted);font-size:13px}
.date{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.date b{font-size:18px}
button{font:inherit;border:0;border-radius:10px;padding:8px 12px;background:var(--line);color:var(--text);cursor:pointer}
button.pri{background:var(--accent);color:#fff;font-weight:600}
button.sm{padding:4px 10px;font-size:13px}
.big{font-size:38px;font-weight:700;line-height:1}
.bar{flex:1;height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.mrow{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:14px}
.mrow span{width:62px}.mrow b{width:92px;text-align:right;font-weight:600}
.mrow.p i{background:var(--p)}.mrow.c i{background:var(--c)}.mrow.f i{background:var(--f)}
.ent{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.ent small{display:block;color:var(--muted)}
.ent button{margin-left:8px;background:none;color:var(--muted)}
.mini{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:13px;color:var(--muted)}
#peek{position:fixed;top:0;left:0;right:0;bottom:0;overflow:hidden;background:var(--bg);z-index:1;pointer-events:none;padding-top:calc(env(safe-area-inset-top,0px) + 12px);will-change:transform}
#app{will-change:transform}
body{touch-action:pan-y pinch-zoom}
nav{z-index:2;position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 30px)}
nav button{flex:1;border-radius:0;background:none;padding:14px 0;color:var(--muted);font-weight:600;font-size:13px}
nav button.on{color:var(--accent)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:5}
.sheet.open{display:flex}
.sheet>div{background:var(--card);width:100%;max-width:560px;margin:0 auto;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 2px}
input,select{width:100%;font:inherit;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chips button{white-space:nowrap;font-size:13px}
.row{display:flex;gap:8px}.row>*{flex:1}
#msg{font-size:13px;color:var(--muted);margin-top:4px;min-height:18px}
.ring{width:170px;height:170px;border-radius:50%;background:conic-gradient(var(--col,var(--accent)) calc(var(--v)*1%),var(--line) 0);display:grid;place-items:center;margin:4px auto}
.ring>div{width:80%;height:80%;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;line-height:1.1}
.ring.s{width:72px;height:72px;margin:0 auto 4px}.ring.s>div{width:78%;height:78%;font-size:13px;font-weight:700}
.three{display:flex;justify-content:space-around;margin-top:14px;text-align:center}
.mhead{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.seg3{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px}.seg3 button{padding:10px 6px;font-size:14px}.seg3 small{opacity:.8;font-size:11px}
textarea{width:100%;font:inherit;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.setrow{display:grid;grid-template-columns:22px 1fr 1fr 44px;gap:6px;align-items:center;margin:6px 0}
.exh{padding:10px 0;border-top:1px solid var(--line)}
.dchip{display:inline-flex;align-items:center;gap:4px;background:var(--line);border-radius:20px;padding:6px 10px;font-size:13px;margin:0;color:var(--text)}.dchip input{width:auto}
.exr{background:var(--bg);border-radius:12px;padding:8px;margin-top:8px;display:grid;gap:6px}.exr .r2{display:grid;grid-template-columns:1fr 1fr auto;gap:6px}.exr .r3{display:grid;grid-template-columns:1fr 130px;gap:6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cell{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-size:12px;background:var(--bg);color:var(--muted)}.cell.done{background:var(--accent);color:#fff}.cell.miss{background:var(--f);color:#fff}.cell.sched{border:1.5px dashed var(--muted)}.cell.now{outline:2px solid var(--text)}
.calh{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:var(--muted);margin-bottom:4px}
.wk{width:100%;border-collapse:collapse;font-size:13px}.wk th{text-align:left;color:var(--muted);font-weight:500;padding:4px 2px}.wk td{padding:6px 2px;border-top:1px solid var(--line)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tile{background:var(--bg);border-radius:12px;padding:10px}.tile b{font-size:20px;display:block}.tile small{color:var(--muted);font-size:12px}
.cbx{width:22px;height:22px;border:2px solid var(--muted);border-radius:6px;display:inline-grid;place-items:center;font-size:14px;color:#fff;flex:0 0 22px}.cbx.on{background:var(--accent);border-color:var(--accent)}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cc{aspect-ratio:1;border-radius:10px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;cursor:pointer}.cc.sel{outline:2px solid var(--accent)}.cc.today span{font-weight:700;color:var(--accent)}.cc.out{background:none;cursor:default}
.dots{display:flex;gap:2px;height:6px;margin-top:2px}.dots i{width:5px;height:5px;border-radius:50%}
.dpbtn{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left}
.dp{background:var(--bg);border-radius:12px;padding:10px;margin-top:6px}.dp .cc{background:var(--card)}.cc.dis{opacity:.3;cursor:default}
.sum{color:var(--muted);font-size:14px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fab{position:fixed;right:18px;bottom:calc(98px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;font-size:32px;line-height:1;padding:0;box-shadow:0 6px 18px rgba(0,0,0,.45);z-index:3}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><pattern id="popdots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1.1" fill="#111" fill-opacity=".28"/></pattern></defs></svg>
<main id="app"></main>
<div class="sheet" id="sheet"><div id="sheetBody"></div></div>
<button class="fab" id="fab" data-a="add" aria-label="Add food">+</button>
<nav><button data-a="tab" data-t="over" id="n-over">Overview</button><button data-a="tab" data-t="today" id="n-today">Food</button><button data-a="tab" data-t="work" id="n-work">Workouts</button><button data-a="tab" data-t="prog" id="n-prog">Progress</button><button data-a="tab" data-t="cal" id="n-cal">Calendar</button><button data-a="tab" data-t="goals" id="n-goals">Goals</button></nav>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const MEALS=['Breakfast','Lunch','Dinner','Snacks'];
const NUT=['kcal','p','c','f','fibre','sugar','salt'];
const PACE={lose:[['gentle','Gentle',-250],['steady','Steady',-500],['faster','Faster',-750]],gain:[['lean','Lean',200],['standard','Standard',350]]};
const DEF={lose:'steady',gain:'lean'};
const DIETS={
  balanced:{n:'Balanced',d:'Protein set by your goal, about 25% of calories from fat, and the rest from carbs.'},
  highprotein:{n:'High protein',d:'More protein (2.4 g per kg of body weight), about 25% fat, and the rest carbs.',ppk:2.4},
  lowcarb:{n:'Low carb',d:'About 25% of calories from carbs, with protein set by your goal and the rest from fat.',carbPct:.25},
  keto:{n:'Keto',d:'Very low carb: about 5% of calories from carbs, 20% protein and the rest from fat.',carbPct:.05,protPct:.2},
  lowfat:{n:'Low fat',d:'About 20% of calories from fat, with protein set by your goal and the rest from carbs.',fat:.2},
  med:{n:'Mediterranean',d:'About 33% of calories from fat, with protein set by your goal and the rest from carbs.',fat:.33},
  highcarb:{n:'High carb (endurance)',d:'About 20% fat and 1.6 g protein per kg, with the rest carbs. Suits lots of running or cycling.',ppk:1.6,fat:.2}
};
let S={goals:{kcal:2200,p:150,c:250,f:70},profile:{sex:'m',age:30,h:175,w:75,act:1.55,goal:'maintain'},foods:[],log:{}};
try{const r=localStorage.getItem('dopt');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
S.templates=S.templates||[];S.wlog=S.wlog||{};S.extra=S.extra||{};S.wmod=S.wmod||{};S.weights=S.weights||[];S.sport=S.sport||{};S.courses=S.courses||[];S.mmap=S.mmap||{};S.recipes=S.recipes||[];S.plan=S.plan||{};S.cal=S.cal||[];S.habits=S.habits||[];S.shop=S.shop||{};S.planTpl=S.planTpl||[];S.pfollow=S.pfollow||{};S.meas=S.meas||{};
const save=()=>{try{localStorage.setItem('dopt',JSON.stringify(S))}catch(e){}if(typeof afterSave==='function')afterSave()};
let tab='over',date=new Date(),sugg=null,wview='day',openWk=null;
const dk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r1=n=>Math.round(n*10)/10;
const num=id=>parseFloat($('#'+id).value)||0;

function totals(list){const t={kcal:0,p:0,c:0,f:0,fibre:0,sugar:0,salt:0};list.forEach(e=>NUT.forEach(k=>t[k]+=e[k]||0));return t}
function bar(cls,label,v,g,u){const pct=Math.min(100,g?v/g*100:0);return `<div class="mrow ${cls}"><span>${label}</span><div class="bar"><i style="width:${pct}%"></i></div><b>${Math.round(v)}/${g}${u}</b></div>`}

let curMeal=null;
function mring(label,v,g,col){const pct=Math.min(100,g?v/g*100:0);return `<div><div class="ring s" style="--v:${pct};--col:${col}"><div>${Math.round(v)}g</div></div><div class="muted">${label} · ${g}g</div></div>`}
function renderLog(){
  const list=S.log[dk(date)]||[],t=totals(list),g=S.goals,left=Math.round(g.kcal-t.kcal);
  const pct=Math.min(100,g.kcal?t.kcal/g.kcal*100:0),isToday=dk(date)===dk(new Date());
  const full=date.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'});
  let h=dateBar(isToday?'Today':full,isToday?full:'','prev','next');
  h+=`<div class="card"><div class="ring" style="--v:${pct};--col:${left<0?'var(--f)':'var(--accent)'}"><div><div><span class="big">${Math.abs(left)}</span><br><span class="muted">kcal ${left>=0?'left':'over'}</span></div></div></div>
  <div class="three">${mring('Protein',t.p,g.p,'var(--p)')}${mring('Carbs',t.c,g.c,'var(--c)')}${mring('Fat',t.f,g.f,'var(--f)')}</div>
  <div class="mini" style="justify-content:center"><span>Eaten ${Math.round(t.kcal)}/${g.kcal}</span><span>Fibre ${r1(t.fibre)}g</span><span>Sugar ${r1(t.sugar)}g</span><span>Salt ${r1(t.salt)}g</span></div></div>`;
  MEALS.forEach(m=>{
    const es=list.filter(e=>e.meal===m),mt=totals(es);
    h+=`<div class="card" data-a="meal" data-m="${m}" style="cursor:pointer"><div class="mhead"><span style="display:flex;align-items:center;gap:10px">${mealArt(m,es,42)}<b>${m}</b></span><span class="muted">${es.length?Math.round(mt.kcal)+' kcal':'Empty'} ›</span></div>`;
    if(es.length)h+=`<div class="sum">${esc(es.map(e=>e.name).join(', '))}</div><div class="mini"><span>P ${r1(mt.p)}g</span><span>C ${r1(mt.c)}g</span><span>F ${r1(mt.f)}g</span></div>`;
    {const pl=((S.plan[dk(date)]||{})[m])||[];if(pl.length)h+=tickRow(dk(date),m,pl)}
    h+='</div>';
  });
  return h;
}

function renderNut(){
  const p=S.profile,g=S.goals;
  const sel=(v,o)=>o.map(([k,l])=>`<option value="${k}" ${String(v)===String(k)?'selected':''}>${l}</option>`).join('');
  const age=profAge(),lw=S.weights.length?S.weights[S.weights.length-1].v:p.w,hasB=!!(p.bday&&ageFrom(p.bday)!=null);
  let h=`<div class="card"><h2>Current data</h2>
  <div class="g2"><div><label>Sex</label><select id="cd-sex">${sel(p.sex,[['m','Male'],['f','Female']])}</select></div><div><label>Birthday</label>${dpHtml('cd-bd',p.bday||'','',dk(new Date()),false,(new Date().getFullYear()-30)+'-01-01')}</div>
  <div><label>Age</label><input id="cd-age" type="number" inputmode="numeric" value="${age}" ${hasB?'readonly':''}></div><div><label>Height (cm)</label><input id="cd-h" type="number" inputmode="decimal" value="${p.h}"></div>
  <div><label>Weight (kg)</label><input id="cd-w" type="number" inputmode="decimal" step="0.1" value="${r1(lw)}"></div></div>
  <div class="muted" style="margin-top:6px">Age works itself out from your birthday once you add it. Weight starts from your latest weigh-in, and saving a new weight adds a weigh-in on the Progress tab.</div><div id="msg"></div>
  <button class="pri" style="width:100%;margin-top:10px" data-a="savecd">Save details</button></div>
  <div class="card"><h2>Suggested macros</h2><div class="muted">Estimates daily targets from your current data (Mifflin-St Jeor). These are general estimates, not medical advice.</div>
  <div class="muted" style="margin-top:4px">Using: ${p.sex==='f'?'Female':'Male'}, ${age} years, ${p.h} cm, ${r1(lw)} kg</div>
  <label>Activity</label><select id="p-act">${sel(p.act,[[1.2,'Sedentary'],[1.375,'Light (1-3 days/wk)'],[1.55,'Moderate (3-5 days/wk)'],[1.725,'Very active (6-7 days/wk)']])}</select>
  <label>Diet type</label><select id="p-diet">${Object.entries(DIETS).map(([k,d])=>`<option value="${k}" ${(p.diet||'balanced')===k?'selected':''}>${d.n}</option>`).join('')}</select><div class="muted" id="p-diet-d" style="margin-top:4px">${(DIETS[p.diet]||DIETS.balanced).d}</div>
  <label>Goal</label><div class="seg3">${[['lose','Lose weight'],['maintain','Maintain'],['gain','Build muscle']].map(([k,l])=>`<button class="${p.goal===k?'pri':''}" data-a="goal" data-v="${k}">${l}</button>`).join('')}</div>
  ${PACE[p.goal]?`<label>Pace</label><div class="seg3">${PACE[p.goal].map(o=>`<button class="${(p.pace||DEF[p.goal])===o[0]?'pri':''}" data-a="pace" data-v="${o[0]}">${o[1]}<br><small>${o[2]>0?'+':''}${o[2]} kcal/day</small></button>`).join('')}</div>`:''}
  <div class="g2"><div><label>Target weight (kg, optional)</label><input id="p-target" type="number" inputmode="decimal" step="0.1" value="${p.target||''}"></div><div><label>Target date (optional)</label>${dpHtml('p-tdate',p.tdate||'',dk(new Date(Date.now()+864e5)),'',true,'')}</div></div>
  <div class="muted" style="margin-top:4px">With a target weight and date, the calorie suggestion is paced to get you there, within safe limits. This applies to the Lose weight and Build muscle goals.</div>
  <button class="pri" style="width:100%;margin-top:12px" data-a="calc">Calculate</button>`;
  if(sugg)h+=`<div style="margin-top:12px"><b>${sugg.kcal} kcal</b> · P ${sugg.p}g · C ${sugg.c}g · F ${sugg.f}g
  <div class="muted">${sugg.diet} · protein ${sugg.sp.p}% · carbs ${sugg.sp.c}% · fat ${sugg.sp.f}% of calories</div>
  ${sugg.wk?`<div class="muted">About ${sugg.wk>0?'+':''}${sugg.wk} kg per week${sugg.eta?` · roughly ${sugg.eta} weeks to reach your target`:''}</div>`:''}
  ${sugg.tdate?`<div class="muted">Paced to reach ${r1(sugg.tw)} kg by ${pkey(sugg.tdate).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</div>`:''}
  ${sugg.dnote?`<div class="muted">${sugg.dnote}</div>`:''}
  ${sugg.note?`<div class="muted">${sugg.note}</div>`:''}
  <button class="pri sm" style="margin-top:8px" data-a="apply">Use these targets</button></div>`;
  h+=`</div><div class="card"><h2>Current targets</h2><div class="g2"><div><label>Calories</label><input id="g-kcal" type="number" value="${g.kcal}"></div><div><label>Protein (g)</label><input id="g-p" type="number" value="${g.p}"></div>
  <div><label>Carbs (g)</label><input id="g-c" type="number" value="${g.c}"></div><div><label>Fat (g)</label><input id="g-f" type="number" value="${g.f}"></div></div>
  <button class="pri" style="width:100%;margin-top:12px" data-a="saveg">Save targets</button></div>`;
  return h;
}

function render(){
  $('#app').innerHTML=tab==='over'?renderOver():tab==='today'?renderToday():tab==='work'?renderWork():tab==='prog'?renderProg():tab==='cal'?renderCal():renderGoals();
  const fv=(tab==='today'&&!(foodView==='plan'&&planView==='weeks'))||tab==='cal'||tab==='work';$('#fab').style.display=fv?'block':'none';$('#fab').dataset.a=tab==='cal'?'caladd':tab==='work'?(wview==='manage'?'newtpl':wview==='week'?'wkadd':'addw'):foodView==='rec'?'newrec':foodView==='plan'?'padd':foodView==='shop'?'shadd':'add';
  ['over','today','work','prog','cal','goals'].forEach(t=>$('#n-'+t).className=tab===t?'on':'');
  if(tab==='over'&&calAuto&&!calCache[calKey()])calLoad();
  if(tab==='cal'&&calAuto&&!calCache[mKey()])calLoad(mRange());
}

/* ---------- Workouts ---------- */
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const utc=d=>Date.UTC(d.getFullYear(),d.getMonth(),d.getDate());
const pkey=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const mon=t=>t-((new Date(t).getUTCDay()+6)%7)*864e5;
function due(t,d){const r=t.rule;if(!r)return false;if(r.every===0)return dk(d)===r.start;if(!r.days.includes(d.getDay()))return false;const wk=Math.round((mon(utc(d))-mon(utc(pkey(r.start))))/(7*864e5));return wk>=0&&wk%r.every===0}
function sessionsFor(d){const ids=new Set(S.templates.filter(t=>due(t,d)).map(t=>t.id));(S.extra[dk(d)]||[]).forEach(i=>ids.add(i));return S.templates.filter(t=>ids.has(t.id))}
function last(tid,name,k){for(const x of Object.keys(S.wlog).filter(x=>x<k).sort().reverse()){const a=S.wlog[x][tid]&&S.wlog[x][tid][name];if(a&&a.some(r=>r.w||r.r))return a}return null}
const mod=(t,n)=>((S.wmod[dk(date)]||{})[t]||{})[n];
function setMod(t,o,v){const k=dk(date),a=S.wmod[k]=S.wmod[k]||{},b=a[t]=a[t]||{};if(v)b[o]=v;else delete b[o];save();render()}
function rowsFor(tid,name){
  const w=S.wlog[dk(date)]=S.wlog[dk(date)]||{},t=w[tid]=w[tid]||{};
  if(!t[name]){
    const tp=S.templates.find(x=>x.id===tid)||{ex:[]};let ex=tp.ex.find(x=>x.name===name);
    if(!ex){const mm=(S.wmod[dk(date)]||{})[tid]||{},o=Object.keys(mm).find(q=>mm[q].swap&&mm[q].swap.name===name);if(o){const sw=mm[o].swap;ex={...tp.ex.find(x=>x.name===o),wt:null};if(sw.sets)ex.sets=sw.sets}}
    t[name]=Array.from({length:ex?ex.sets:3},()=>({w:ex&&ex.wt!=null?ex.wt:'',r:'',done:false}));
  }
  return t[name];
}
function goDate(k){date=pkey(k);openWk=null;render()}
function dateBar(label,sub,prev,next){

/* ---------- Garmin import ---------- */
function parseCSV(t){
  const r=[];let row=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;
    else if(ch===','){row.push(c);c=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(c);c='';if(row.length>1||row[0])r.push(row);row=[]}
    else c+=ch}
  if(c||row.length){row.push(c);r.push(row)}
  return r;
}
/* ---------- Apple Health import (paste or file) ---------- */
const norm=o=>{const n={};for(const k in o)n[k.toLowerCase().replace(/[^a-z]/g,'')]=o[k];return n};
const pick=(n,ks)=>{for(const k of ks)if(n[k]!==undefined&&n[k]!=='')return n[k]};
function toKm(v,unit){
  if(v==null)return 0;const m=String(v).replace(/,/g,'').match(/([\d.]+)\s*(km|kilometers?|mi|miles?|m|meters?|metres?|yd|yards?)?/i);if(!m)return 0;
  const x=parseFloat(m[1]),u=(m[2]||unit||'km').toLowerCase();
  if(u[0]==='k')return x;if(u==='mi'||u.startsWith('mile'))return x*1.609344;if(u==='yd'||u.startsWith('yard'))return x*0.0009144;return x/1000;
}
function toSec(n){
  const q=pick(n,['durationseconds','seconds']);if(q!==undefined)return parseFloat(q)||0;
  const v=pick(n,['durationminutes','duration','minutes','time']);if(v===undefined)return 0;const t=String(v).trim();
  if(t.includes(':')){let sc=0;t.split(':').forEach(x=>{sc=sc*60+(parseFloat(x)||0)});return sc}
  let tot=0,f=false;t.replace(/([\d.]+)\s*(hours?|hrs?|h|minutes?|mins?|m|seconds?|secs?|s)\b/gi,(_,a,u)=>{f=true;u=u.toLowerCase();tot+=parseFloat(a)*(u[0]==='h'?3600:u.startsWith('m')?60:1)});
  return f?tot:(parseFloat(t)||0)*60;
}
function addAct(ty,k,sc,km,key,title){
  const t=sessionFor(ty,k);
  const a=S.sport[k]=S.sport[k]||{},e=a[t.id]=a[t.id]||(ty==='tennis'?{matches:[{opp:'',sets:[['','']]}],notes:''}:ty==='swim'?{lens:'',pool:t.pool||25,h:'',m:'',s:'',notes:''}:{dist:'',h:'',m:'',s:'',notes:''});
  e.ids=e.ids||[];if(e.ids.includes(key))return 0;e.ids.push(key);
  if(ty==='tennis'){e.imp=true;e.notes=(e.notes?e.notes+' · ':'')+'Health: '+(title||'Tennis')+', '+fmtT(sc);return 1}
  const ts=secs(e)+sc;e.h=String(Math.floor(ts/3600));e.m=String(Math.floor(ts%3600/60));e.s=String(Math.floor(ts%60));
  if(ty==='swim'){const pool=parseFloat(e.pool)||t.pool||25;e.pool=pool;e.lens=String(Math.round(((parseFloat(e.lens)||0)*pool+km*1000)/pool))}
  else e.dist=String(Math.round(((parseFloat(e.dist)||0)+km)*100)/100);
  return 1;
}
function importHealth(text,du){
  text=text.replace(/^\uFEFF/,'').trim();if(!text)return 'Nothing to import. Paste your workouts first.';
  let recs=[];
  try{
    if(/^[\[{]/.test(text)){let j=JSON.parse(text);if(!Array.isArray(j))j=j.workouts||j.data||[];recs=j.map(norm)}
    else{const rows=parseCSV(text),h=rows[0].map(x=>x.toLowerCase());
      if(h.some(x=>/type|start|date|duration/.test(x))){const hd=rows[0].map(x=>x.toLowerCase().replace(/[^a-z]/g,''));recs=rows.slice(1).map(r=>{const o={};hd.forEach((k,i)=>o[k]=r[i]);return o})}
      else recs=rows.map(r=>({type:r[0],start:r[1],duration:r[2],distance:r[3]}))}
  }catch(x){return 'Could not read that. It should be JSON, or lines like: Running,2026-09-28T07:15:00,28 min,5.02 km'}
  let added=0,dup=0,skip=0;
  recs.forEach(n=>{
    const tt=String(pick(n,['type','workouttype','activitytype','workoutactivitytype','activity'])||'').toLowerCase();
    const ty=tt.includes('run')?'run':/cycl|bik/.test(tt)?'cycle':tt.includes('swim')?'swim':tt.includes('tennis')?'tennis':null;
    const st=String(pick(n,['start','startdate','startdatetime','date'])||'');
    if(!ty||!st){skip++;return}
    const k=/^\d{4}-\d{2}-\d{2}/.test(st)?st.slice(0,10):(isNaN(new Date(st))?'':dk(new Date(st)));if(!k){skip++;return}
    let km=0;[['distancekm','km'],['distancemiles','mi'],['distancemi','mi'],['distancem','m'],['distancemeters','m'],['distance',du]].some(([key,u])=>{const v=pick(n,[key]);if(v!==undefined){km=toKm(v,u);return true}});
    if(addAct(ty,k,toSec(n),km,st+'|'+ty,tt))added++;else dup++;
  });
  save();
  return `Imported ${added} workout${added===1?'':'s'}. ${dup} already imported, ${skip} skipped (other types, or no date).`;
}

  return t;
}
function addTennis(k,opp,txt){
  const t=sessionFor('tennis',k),a=S.sport[k]=S.sport[k]||{},e=a[t.id]=a[t.id]||{matches:[{opp:'',sets:[['','']]}],notes:''};
  const sets=(txt.match(/\d+\s*[-–]\s*\d+/g)||[]).map(x=>x.split(/[-–]/).map(y=>y.trim()));
  const m={opp:opp.trim(),sets:sets.length?sets:[['','']]},blank=q=>!q.opp&&q.sets.every(x=>x[0]===''&&x[1]==='');
  if(e.matches.length===1&&blank(e.matches[0]))e.matches[0]=m;else e.matches.push(m);

/* ---------- Golf ---------- */
const strokesOn=(ph,si)=>{const p=Math.round(ph);return p<=0?0:Math.floor(p/18)+(si<=p%18?1:0)};
const gpts=(sc,par,si,ph)=>{const g=parseFloat(sc);return g>0?Math.max(0,2+par-(g-strokesOn(ph,si))):null};
function golfPH(e,co){
  if(e.ph!==''&&!isNaN(parseFloat(e.ph)))return Math.round(parseFloat(e.ph));
  const hi=parseFloat(e.hcp);if(isNaN(hi))return 0;
  if(co&&co.slope&&co.cr){const par=co.holes.reduce((a,x)=>a+x.par,0);return Math.round((hi*co.slope/113+(co.cr-par))*0.95)}
  return Math.round(hi);
}
function golfCalc(e){
  const co=S.courses.find(c=>c.id===e.course),holes=co?co.holes:Array.from({length:18},(_,i)=>({par:4,si:i+1})),ph=golfPH(e,co);
  let o=0,n=0,g=0,pp=0,played=0;const pts=holes.map((ho,i)=>{const p=gpts(e.holes[i],ho.par,ho.si,ph);if(p!=null){if(i<9)o+=p;else n+=p;g+=parseFloat(e.holes[i]);pp+=ho.par;played++}return p});
  return {co,holes,ph,pts,o,n,tot:o+n,g,vs:g-pp,played};
}
const golfSum=c=>c.played?`<b>${c.tot} Stableford points</b> · Out ${c.o} · In ${c.n}<br><span class="muted">Gross ${c.g} (${c.vs>0?'+':''}${c.vs} vs par over ${c.played} holes)</span>`:'<span class="muted">Enter your scores to see Stableford points</span>';
function refreshGolf(t,e){
  const c=golfCalc(e);
  c.holes.forEach((ho,i)=>{const p=$('#gp-'+t.id+'-'+i);if(p)p.textContent=c.pts[i]==null?'–':c.pts[i];const sr=strokesOn(c.ph,ho.si),x=$('#gs-'+t.id+'-'+i);if(x)x.innerHTML=ho.si+(sr?' <span class="muted">'+'•'.repeat(sr)+'</span>':'')});
  const g=$('#gt-'+t.id);if(g)g.innerHTML=golfSum(c);const q=$('#gi-'+t.id);if(q)q.textContent='Playing handicap: '+c.ph;

const gramsOf=q=>{const m=String(q||'').replace(/,/g,'').match(/^\s*([\d.]+)\s*(kg|g|ml|l)?\s*$/i);if(!m)return null;const v=parseFloat(m[1]);if(isNaN(v))return null;const u=(m[2]||'g').toLowerCase();return u==='kg'||u==='l'?v*1000:v};
const rd2=v=>Math.round((v||0)*100)/100;
function readIngs(){
  return [...document.querySelectorAll('#r-ings .exr')].map(r=>{
    const g=c=>parseFloat(r.querySelector(c).value),per=r.dataset.per?JSON.parse(r.dataset.per):null,q=r.querySelector('.i-q').value.trim(),gm=gramsOf(q);
    const ex=r.dataset.ex?JSON.parse(r.dataset.ex):(per&&gm?{fibre:rd2(per.fibre*gm/100),sugar:rd2(per.sugar*gm/100),salt:rd2(per.salt*gm/100)}:{fibre:0,sugar:0,salt:0});
    return {n:r.querySelector('.i-n').value.trim(),q,kcal:g('.i-k')||0,p:g('.i-p')||0,c:g('.i-c')||0,f:g('.i-f')||0,fibre:ex.fibre||0,sugar:ex.sugar||0,salt:ex.salt||0,per:per||undefined,bc:r.querySelector('.i-bc').value.trim()};
  });
}
function ingTotals(ings,sv){const o={};NUT.forEach(x=>{const f=x==='salt'?100:10;o[x]=Math.round(ings.reduce((a,i)=>a+(i[x]||0),0)/(sv>0?sv:1)*f)/f});return o}
function ingApply(row){
  const per=row.dataset.per?JSON.parse(row.dataset.per):null,gm=gramsOf(row.querySelector('.i-q').value);if(!per||!gm)return;
  const k=gm/100,set=(c,v)=>{row.querySelector(c).value=Math.round((v||0)*k*10)/10};
  set('.i-k',per.kcal);set('.i-p',per.p);set('.i-c',per.c);set('.i-f',per.f);
  row.dataset.ex=JSON.stringify({fibre:rd2(per.fibre*k),sugar:rd2(per.sugar*k),salt:rd2(per.salt*k)});
}
async function ingLookup(row,code){
  const mg=row.querySelector('.i-msg'),say2=t=>{if(mg)mg.textContent=t};
  code=String(code||row.querySelector('.i-bc').value).replace(/\D/g,'');if(!code){say2('Enter or scan a barcode first.');return}
  say2('Looking up…');
  try{
    const r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+code+'.json'),d=await r.json();
    if(d.status!==1||!d.product){say2('Product not found. Enter the ingredient by hand.');return}
    const n=d.product.nutriments||{},g=x=>n[x]!=null?+n[x]:0;
    row.dataset.per=JSON.stringify({kcal:g('energy-kcal_100g'),p:g('proteins_100g'),c:g('carbohydrates_100g'),f:g('fat_100g'),fibre:g('fiber_100g'),sugar:g('sugars_100g'),salt:g('salt_100g')});
    row.querySelector('.i-bc').value=code;
    row.querySelector('.i-n').value=(d.product.product_name||'')+(d.product.brands?' ('+d.product.brands.split(',')[0]+')':'');
    const q=row.querySelector('.i-q');if(!q.value.trim())q.value='100 g';
    ingApply(row);say2('Found. Nutrition is worked out from the amount above. Change the amount to update it.');
  }catch(e){say2('Lookup unavailable here (no connection, or the app is in a restricted preview). Enter the ingredient by hand.')}
}
let iscanner=null,iscanRow=null;

async function ingScan(row){

    iscanner=new Html5Qrcode('ireader',{formatsToSupport:[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E],useBarCodeDetectorIfSupported:true,verbose:false});

function buildRecipe(o){
  const sv=o.servings>0?o.servings:1,ing=o.ings.filter(i=>i.n);let m={...o.m};

  if(!(m.kcal>0)&&!(m.p>0)&&!(m.c>0)&&!(m.f>0)&&has)Object.assign(m,ingTotals(ing,sv));
  NUT.forEach(x=>{m[x]=m[x]||0});
  return {id:o.id||'rc'+Date.now().toString(36),name:o.name,servings:sv,ing,steps:o.steps,m};
}

function buildReminders(now){

  S.habits.forEach(h=>{if(h.time&&/^\d\d:\d\d$/.test(h.time)){const [hh,mm]=h.time.split(':').map(Number);

  const from=dk(now),to=dk(new Date(now.getFullYear(),now.getMonth(),now.getDate()+14)),tasks=[];
  S.cal.forEach(x=>{if(x.type!=='task'||!x.t)return;occurrences(x,from,to).forEach(k=>{if(isDone({...x,ok:k}))return;const at=new Date(k+'T'+x.t+':00');if(at>now)tasks.push({at,title:x.title,body:'Due at '+x.t+(x.body?' · '+x.body.slice(0,60):'')})})});

  return out;
}
async function scheduleReminders(){
  const P=nativeP();if(!P||!P.LocalNotifications)return;const LN=P.LocalNotifications,list=buildReminders(new Date());

    await LN.schedule({notifications:list});
  }catch(e){}
}

function calc(){
  readProfile();const p=S.profile;
  const tdee=(10*p.w+6.25*p.h-5*p.age+(p.sex==='m'?5:-161))*p.act;
  const opts=PACE[p.goal]||[],opt=opts.find(o=>o[0]===p.pace)||opts.find(o=>o[0]===DEF[p.goal]);
  let adj=opt?opt[2]:0,note='',dnote='',usedDate=false;
  if(p.tdate&&(p.goal==='lose'||p.goal==='gain')){
    if(!(p.target>0))dnote='Add a target weight to use the target date.';
    else{
      const days=du(pkey(p.tdate))-du(pkey(dk(new Date()))),need=p.target-p.w;
      if(days<=0)dnote='The target date has passed, so I used your chosen pace instead.';
      else if((p.goal==='lose'&&need>=0)||(p.goal==='gain'&&need<=0))dnote='Your target weight does not match your goal, so I used your chosen pace instead.';
      else{
        const wkNeed=need/(days/7),cap=p.goal==='lose'?-0.01*p.w:0.005*p.w,over=p.goal==='lose'?wkNeed<cap:wkNeed>cap;let wk=wkNeed;
        if(over){wk=cap;dnote='Reaching '+r1(p.target)+' kg by then would need '+r1(Math.abs(wkNeed))+' kg a week, which is faster than recommended. This plan uses '+r1(Math.abs(cap))+' kg a week instead, so you would reach it a little later.'}
        adj=Math.round(wk*7700/7);usedDate=true;
      }
    }
  }
  let kcal=tdee+adj;
  const floor=p.sex==='m'?1500:1200;
  if(kcal<floor){kcal=floor;note='Raised to a minimum floor of '+floor+' kcal. Very low intakes are best discussed with a professional.'}
  kcal=Math.round(kcal/10)*10;
  const D=DIETS[p.diet]||DIETS.balanced,ppk=D.ppk||(p.goal==='lose'?2.2:p.goal==='gain'?2.0:1.8);
  const pr=D.protPct?Math.round(kcal*D.protPct/4):Math.round(p.w*ppk);
  let f,c;
  if(D.carbPct){c=Math.round(kcal*D.carbPct/4);f=Math.max(0,Math.round((kcal-pr*4-c*4)/9))}
  else{f=Math.round(kcal*(D.fat||.25)/9);c=Math.max(0,Math.round((kcal-pr*4-f*9)/4))}
  if(p.diet==='keto')note=(note?note+' ':'')+'Keto and other very low-carb diets are restrictive. Check with a doctor or dietitian first, especially if you have a health condition or take medication.';
  const wk=r1((kcal-tdee)*7/7700);
  const ok=p.target&&((wk<0&&p.target<p.w)||(wk>0&&p.target>p.w));
  sugg={kcal,p:pr,c,f,dnote,tdate:usedDate?p.tdate:'',tw:p.target,diet:D.n,sp:{p:Math.round(pr*4/kcal*100),c:Math.round(c*4/kcal*100),f:Math.round(f*9/kcal*100)},wk:p.goal==='maintain'?0:wk,eta:ok?Math.ceil(Math.abs(p.target-p.w)/Math.abs(wk)):0,note};
  save();render();
}

lay=e.target.value==='0'?'none':''}});

/* ---------- Swipe between tabs: the screens follow your finger ---------- */
const TAB_ORDER=['over','today','work','prog','cal','goals'];
const TAB_FN=()=>({over:renderOver,today:renderToday,work:renderWork,prog:renderProg,cal:renderCal,goals:renderGoals});
let sw=null,swBusy=false,peekEl=null;
const vw=()=>(typeof window!=='undefined'&&window.innerWidth)||400;
const swReduced=()=>typeof window!=='undefined'&&window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function swPeek(dir){
  const j=TAB_ORDER.indexOf(tab)+dir;if(j<0||j>=TAB_ORDER.length)return false;
  if(!peekEl){peekEl=document.createElement('main');peekEl.id='peek';document.body.appendChild(peekEl)}
  peekEl.style.display='block';peekEl.innerHTML=TAB_FN()[TAB_ORDER[j]]();sw.next=TAB_ORDER[j];return true;
}
function swReset(){const app=$('#app');if(app){app.style.transition='none';app.style.transform=''}if(peekEl){peekEl.remove();peekEl=null}sw=null;swBusy=false}
document.addEventListener('touchstart',e=>{
  if(swBusy){return}
  const t=e.touches&&e.touches[0];if(!t){sw=null;return}
  const el=e.target,w=vw();
  const skip=t.clientX<28||t.clientX>w-28||!!(el&&el.closest&&el.closest('input,select,textarea,.sheet,.dp,table,.chips,[data-noswipe]'))||$('#sheet').classList.contains('open');
  sw=skip?null:{x:t.clientX,y:t.clientY,mode:null,dir:0,next:null,dx:0,lx:t.clientX,lt:Date.now(),v:0};
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!sw||swBusy)return;const t=e.touches&&e.touches[0];if(!t)return;
  const dx=t.clientX-sw.x,dy=t.clientY-sw.y;
  if(!sw.mode){if(Math.abs(dx)<10&&Math.abs(dy)<10)return;sw.mode=Math.abs(dx)>Math.abs(dy)*1.4?'h':'v';if(sw.mode==='v'){sw=null;return}}
  const dir=dx<0?1:-1,w=vw(),app=$('#app'),now=Date.now();
  if(dir!==sw.dir){sw.dir=dir;sw.next=null;if(!swPeek(dir)&&peekEl)peekEl.style.display='none'}
  sw.v=(t.clientX-sw.lx)/Math.max(1,now-sw.lt);sw.lx=t.clientX;sw.lt=now;sw.dx=dx;
  app.style.transition='none';
  if(sw.next){peekEl.style.transition='none';app.style.transform='translateX('+dx+'px)';peekEl.style.transform='translateX('+(dx+(dir>0?w:-w))+'px)'}
  else app.style.transform='translateX('+(dx*0.25)+'px)';
},{passive:true});
function swFinish(){
  const s=sw;if(!s||s.mode!=='h'){sw=null;return}
  sw=null;swBusy=true;
  const w=vw(),app=$('#app'),dx=s.dx,fast=Math.abs(s.v)>0.5&&Math.abs(dx)>40,commit=!!s.next&&(Math.abs(dx)>w*0.3||fast),dur=swReduced()?0:220,tr=dur?'transform '+dur+'ms ease-out':'none';
  app.style.transition=tr;
  if(commit){
    peekEl.style.transition=tr;app.style.transform='translateX('+(-s.dir*w)+'px)';peekEl.style.transform='translateX(0px)';
    ['over','today','work','prog','cal','goals'].forEach(x=>{const b=$('#n-'+x);if(b)b.className=x===s.next?'on':''});
    setTimeout(()=>{tab=s.next;openWk=null;render();swReset();if(typeof window!=='undefined'&&window.scrollTo)window.scrollTo(0,0)},dur+30);
  }else{
    app.style.transform='translateX(0px)';if(peekEl){peekEl.style.transition=tr;peekEl.style.transform='translateX('+(s.dir>0?w:-w)+'px)'}
    setTimeout(swReset,dur+30);
  }
}
document.addEventListener('touchend',swFinish,{passive:true});
document.addEventListener('touchcancel',()=>{if(sw&&sw.mode==='h')swFinish();else sw=null},{passive:true});
render();
